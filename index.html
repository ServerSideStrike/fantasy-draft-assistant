<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#111827">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Draft Board">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="apple-touch-icon" href="icon.svg">
  <title>Fantasy Draft Assistant</title>
  <style>
    :root{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color-scheme:dark}
    *{box-sizing:border-box}
    html{scroll-behavior:smooth}
    body{margin:0;background:#0b1020;color:#f8fafc}
    button,input,select{font:inherit}
    button{min-height:44px}
    .wrap{max-width:1080px;margin:auto;padding:14px}
    header{position:sticky;top:0;z-index:20;background:rgba(11,16,32,.98);padding:10px 0 10px}
    h1{font-size:22px;margin:0 0 10px}
    .tabs,.filters{display:flex;gap:8px;flex-wrap:wrap}
    .tabs button,.filters button,.tier-btn{border:1px solid #334155;background:#111827;color:#e5e7eb;border-radius:10px;padding:8px 12px}
    .tabs button.active,.filters button.active{background:#2563eb;border-color:#2563eb}
    input,select{min-height:44px;background:#111827;color:#fff;border:1px solid #334155;border-radius:10px;padding:9px 10px}
    input{width:100%;margin:10px 0 8px}
    .status{font-size:13px;color:#94a3b8;margin-top:8px}

    .team-tabs-wrap{margin:6px -14px 4px;padding:0 14px;overflow-x:auto;overscroll-behavior-inline:contain;scrollbar-width:thin}
    .team-tabs{display:flex;gap:7px;width:max-content;padding:4px 0 7px}
    .team-tab{white-space:nowrap;border:1px solid #334155;background:#111827;color:#e5e7eb;border-radius:12px;padding:5px;min-height:48px;min-width:52px;display:flex;align-items:center;justify-content:center}
    .team-tab img{width:36px;height:36px;object-fit:contain;display:block}
    .team-tab .team-fallback{font-size:12px;font-weight:800;letter-spacing:.03em}
    .team-tab.active{background:#2563eb;border-color:#2563eb;color:#fff;font-weight:700}
    .team-title{display:flex;align-items:center;gap:10px}
    .team-title img{width:42px;height:42px;object-fit:contain;display:block}
    .team-title .team-fallback{width:42px;height:42px;border-radius:10px;background:#182236;border:1px solid #334155;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:800}

    .team{border:1px solid #243047;border-radius:14px;margin:12px 0;overflow:hidden}
    .team h2{font-size:20px;margin:0;padding:14px 16px;background:#111827}
    .position h3{
      font-size:18px;
      letter-spacing:.06em;
      margin:0;
      padding:12px 14px;
      background:#182236;
      border-top:1px solid #334155;
      border-bottom:1px solid #334155;
    }
    .player{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:10px;align-items:center;padding:10px 12px;border-top:1px solid #1e293b}
    .identity{display:grid;grid-template-columns:56px minmax(0,1fr);gap:10px;align-items:center;min-width:0}
    .headshot{width:56px;height:56px;border-radius:12px;overflow:hidden;background:#182236;border:1px solid #334155;display:flex;align-items:center;justify-content:center;color:#94a3b8;font-size:13px;font-weight:700;flex:0 0 auto}
    .headshot img{width:100%;height:100%;object-fit:cover;object-position:center top;display:block}
    .player-copy{min-width:0}
    .player.drafted{opacity:.46}
    .name{font-weight:650;font-size:16px}
    .meta{font-size:12px;color:#94a3b8;margin-top:3px}
    .stats{font-size:12px;color:#cbd5e1;margin-top:5px;line-height:1.45}
    .stat-primary{font-weight:700;color:#f8fafc}
    .actions{display:flex;gap:6px;align-items:center}
    .clear-rank-btn{border:1px solid #475569;background:#111827;color:#cbd5e1;border-radius:9px;padding:7px 8px;min-width:44px;font-size:12px;font-weight:700}
    .clear-rank-btn:disabled{opacity:.3}
    .tier-select{width:64px}
    .draft-btn{border:1px solid #334155;background:#111827;color:#e5e7eb;border-radius:9px;padding:7px 9px;min-width:44px}
    .rank-move{display:flex;gap:4px}
    .rank-move button{border:1px solid #475569;background:#111827;color:#e5e7eb;border-radius:9px;min-width:38px;min-height:38px;padding:5px 7px;font-weight:800}
    .rank-move button:disabled{opacity:.25}
    .draft-summary{display:flex;gap:8px;flex-wrap:wrap;margin:12px 0}
    .draft-chip{border:1px solid #334155;background:#111827;border-radius:10px;padding:8px 10px;font-size:13px;color:#cbd5e1}
    .draft-chip strong{color:#fff}
    .draft-mode-head{display:flex;justify-content:space-between;gap:10px;align-items:center;margin:12px 0}
    .draft-mode-head h2{margin:0;font-size:21px}
    .undo-btn{border:1px solid #475569;background:#111827;color:#fff;border-radius:10px;padding:8px 12px;font-weight:700}
    .undo-btn:disabled{opacity:.35}
    .mine{outline:2px solid #22c55e}
    .tier-section{margin:12px 0;border:1px solid #243047;border-radius:14px;overflow:hidden}
    .tier-head{display:flex;justify-content:space-between;align-items:center;padding:11px 14px;background:#111827}
    .tier-head strong{font-size:18px}
    .rank{width:28px;color:#94a3b8;text-align:right}
    .small{font-size:12px;color:#94a3b8}
    .empty{padding:18px;color:#94a3b8;text-align:center}
    .toolbar{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}
    .toolbar button,.toolbar label span{border:1px solid #334155;background:#111827;color:#e5e7eb;border-radius:10px;padding:8px 12px}
    .scoring-wrap{display:flex;align-items:center;gap:7px;font-size:13px;color:#cbd5e1}
    .scoring-wrap select{min-height:40px;padding:6px 9px}

    @media(max-width:620px){
      .league-grid{grid-template-columns:repeat(2,minmax(0,1fr))}

      .app-header{align-items:center;gap:8px}
      .header-copy{min-width:0}
      .header-search{flex:0 0 44%;min-width:135px;max-width:210px}
      .header-search input{padding:8px 9px;font-size:14px}

      .tabs{display:grid;grid-template-columns:repeat(2,minmax(0,1fr))}
      .tabs button{width:100%;padding-left:7px;padding-right:7px}

      .player{grid-template-columns:1fr}
      .identity{grid-template-columns:52px minmax(0,1fr)}
      .headshot{width:52px;height:52px}
      .actions{justify-content:flex-end}
      .wrap{padding:10px}
      .team-tabs-wrap{margin-left:-10px;margin-right:-10px;padding-left:10px;padding-right:10px}
      .position h3{font-size:19px;padding:13px 14px}
    }
  
    .app-header{display:flex;justify-content:space-between;align-items:flex-start;gap:14px}
    .header-search{margin-left:auto;flex:0 1 300px;min-width:180px}
    .header-search input{width:100%;box-sizing:border-box}

  
    .league-btn{border:1px solid #334155;background:#111827;color:#e5e7eb;border-radius:10px;padding:8px 11px;font-weight:700}
    .needs-box{border:1px solid #334155;background:#0b1220;border-radius:12px;padding:10px 12px;margin:10px 0}
    .needs-title{font-size:13px;font-weight:800;color:#fff;margin-bottom:7px}
    .needs-chips{display:flex;gap:6px;flex-wrap:wrap}
    .need-chip{border:1px solid #475569;background:#111827;color:#cbd5e1;border-radius:999px;padding:5px 8px;font-size:12px}
    .need-chip.open{border-color:#f59e0b;color:#fbbf24}
    .need-chip.done{border-color:#334155;color:#94a3b8}
    .need-badge{display:inline-block;margin-left:5px;border:1px solid #f59e0b;color:#fbbf24;border-radius:999px;padding:1px 6px;font-size:10px;font-weight:800;vertical-align:1px}
    .league-modal{position:fixed;inset:0;background:rgba(0,0,0,.68);display:none;align-items:center;justify-content:center;padding:16px;z-index:999}
    .league-modal.open{display:flex}
    .league-card{width:min(560px,100%);max-height:88vh;overflow:auto;background:#0f172a;border:1px solid #334155;border-radius:16px;padding:16px;box-shadow:0 20px 60px rgba(0,0,0,.45)}
    .league-card h2{margin:0 0 4px}
    .league-card .sub{color:#94a3b8;font-size:13px;margin-bottom:14px}
    .league-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
    .league-field{display:flex;flex-direction:column;gap:4px}
    .league-field label{font-size:12px;color:#94a3b8;font-weight:700}
    .league-field input,.league-field select{width:100%;box-sizing:border-box;background:#111827;color:#fff;border:1px solid #334155;border-radius:9px;padding:9px}
    .league-actions{display:flex;justify-content:flex-end;gap:8px;margin-top:16px}
    .league-actions button{border:1px solid #475569;background:#111827;color:#fff;border-radius:10px;padding:9px 13px;font-weight:700}
    .league-actions .primary{background:#2563eb;border-color:#2563eb}

  
    /* v2.6.1 mobile header/search containment fix */
    html,body{max-width:100%;overflow-x:hidden}
    .app-header{width:100%;max-width:100%;box-sizing:border-box;min-width:0}
    .header-copy{min-width:0;flex:1 1 auto}
    .header-search{min-width:0;max-width:300px;box-sizing:border-box}
    .header-search input{min-width:0;max-width:100%;box-sizing:border-box}
    @media(max-width:620px){
      .app-header{display:grid;grid-template-columns:minmax(0,1fr) minmax(120px,42vw);width:100%;max-width:100%;align-items:center}
      .header-copy{min-width:0;overflow:hidden}
      .header-search{width:100%;min-width:0;max-width:none;margin-left:0;justify-self:end}
      .header-search input{width:100%;min-width:0;max-width:100%;font-size:14px;padding:8px}
    }

  
    /* v2.6.2 header actions */
    .header-actions{display:flex;align-items:center;gap:8px;margin-left:auto;min-width:0;flex:0 1 auto}
    .header-actions .league-btn{white-space:nowrap;flex:0 0 auto}
    .header-actions .header-search{margin-left:0;flex:1 1 220px;min-width:0}
    @media(max-width:620px){
      .app-header{grid-template-columns:minmax(0,1fr) minmax(0,58vw)}
      .header-actions{width:100%;min-width:0;gap:5px;justify-self:end}
      .header-actions .league-btn{padding:8px 7px;font-size:12px}
      .header-actions .header-search{flex:1 1 auto;width:auto;min-width:0}
      .header-actions .header-search input{min-width:0;width:100%;padding:8px 7px}
    }

  
    /* v2.6.3 corrected header structure */
    .app-header{
      display:grid;
      grid-template-columns:minmax(0,1fr) minmax(280px,420px);
      align-items:center;
      gap:12px;
      width:100%;
      max-width:100%;
      box-sizing:border-box;
      margin-bottom:10px;
    }
    .header-copy{min-width:0;overflow:visible}
    .header-copy h1{margin:0}
    .header-actions{
      display:grid;
      grid-template-columns:auto minmax(160px,1fr);
      align-items:center;
      gap:8px;
      width:100%;
      min-width:0;
      margin-left:0;
    }
    .header-actions .league-btn{white-space:nowrap}
    .header-actions .header-search{
      width:100%;
      min-width:0;
      max-width:none;
      margin:0;
    }
    .header-actions .header-search input{
      width:100%;
      min-width:0;
      max-width:100%;
      box-sizing:border-box;
    }
    @media(max-width:620px){
      .app-header{
        grid-template-columns:minmax(0,.8fr) minmax(205px,1.2fr);
        gap:7px;
      }
      .header-copy h1{font-size:18px;line-height:1.05}
      .header-actions{
        grid-template-columns:auto minmax(115px,1fr);
        gap:5px;
      }
      .header-actions .league-btn{
        padding:7px 6px;
        font-size:11px;
      }
      .header-actions .header-search input{
        padding:7px 6px;
        font-size:13px;
      }
    }
    @media(max-width:390px){
      .header-copy h1{font-size:16px}
      .app-header{grid-template-columns:minmax(0,.65fr) minmax(210px,1.35fr)}
      .header-actions .league-btn{font-size:0;padding:7px 9px}
      .header-actions .league-btn::first-letter{font-size:14px}
    }

  </style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="app-header">
      <div class="header-copy"><h1>Fantasy Draft Assistant</h1></div>
      <div class="header-actions"><button id="leagueBtn" class="league-btn">⚙ League</button><div class="header-search"><input id="search" placeholder="Search player…" autocomplete="off"></div></div>
    </div>


    <div class="tabs">
      <button id="playersTab" class="active">Players</button>
      <button id="boardTab">My Rankings</button>
      <button id="myTeamTab">My Team</button>
      <button id="draftTab">Draft Mode</button>
    </div>

    

    <div id="teamNavHost" class="team-tabs-wrap">
      <div id="teamTabs" class="team-tabs"></div>
    </div>

    <div class="filters" id="positionFilters"></div>

    <div class="toolbar">
      <button id="availableToggle">Available only: Off</button>
      <div class="scoring-wrap">
        <span>2025 points:</span>
        <select id="scoringSelect" aria-label="Fantasy scoring format">
          <option value="PPR">PPR</option>
          <option value="HALF">Half PPR</option>
          <option value="STD">Standard</option>
        </select>
      </div>
      <button id="refreshBtn">Refresh players & stats</button>
      
    </div>

    <div id="status" class="status">Loading player data…</div>
  </header>

  <main id="content"></main>
</div>


<div id="leagueModal" class="league-modal" aria-hidden="true">
  <div class="league-card" role="dialog" aria-modal="true" aria-labelledby="leagueTitle">
    <h2 id="leagueTitle">League Settings</h2>
    <div class="sub">Set your league format once. My Team and Draft Mode will use it to track remaining roster needs.</div>
    <div class="league-grid">
      <div class="league-field"><label for="leagueTeams">Teams</label><input id="leagueTeams" type="number" min="4" max="32" step="1"></div>
      <div class="league-field"><label for="leagueScoring">Scoring</label><select id="leagueScoring"><option value="PPR">PPR</option><option value="HALF">Half PPR</option><option value="STD">Standard</option></select></div>
      <div class="league-field"><label for="leagueQB">QB</label><input id="leagueQB" type="number" min="0" max="4" step="1"></div>
      <div class="league-field"><label for="leagueRB">RB</label><input id="leagueRB" type="number" min="0" max="8" step="1"></div>
      <div class="league-field"><label for="leagueWR">WR</label><input id="leagueWR" type="number" min="0" max="8" step="1"></div>
      <div class="league-field"><label for="leagueTE">TE</label><input id="leagueTE" type="number" min="0" max="4" step="1"></div>
      <div class="league-field"><label for="leagueFLEX">FLEX</label><input id="leagueFLEX" type="number" min="0" max="4" step="1"></div>
      <div class="league-field"><label for="leagueK">K</label><input id="leagueK" type="number" min="0" max="2" step="1"></div>
      <div class="league-field"><label for="leagueDEF">DEF</label><input id="leagueDEF" type="number" min="0" max="2" step="1"></div>
      <div class="league-field"><label for="leagueBench">Bench</label><input id="leagueBench" type="number" min="0" max="20" step="1"></div>
    </div>
    <div class="league-actions">
      <button id="leagueCancel">Cancel</button>
      <button id="leagueSave" class="primary">Save Settings</button>
    </div>
  </div>
</div>

<script>
(() => {
  const PLAYER_API = "https://api.sleeper.app/v1/players/nfl?active=true";
  const STATS_API = "https://api.sleeper.app/v1/stats/nfl/regular/2025";

  const TEAM_NAMES = {
    ARI:"Arizona Cardinals",ATL:"Atlanta Falcons",BAL:"Baltimore Ravens",BUF:"Buffalo Bills",
    CAR:"Carolina Panthers",CHI:"Chicago Bears",CIN:"Cincinnati Bengals",CLE:"Cleveland Browns",
    DAL:"Dallas Cowboys",DEN:"Denver Broncos",DET:"Detroit Lions",GB:"Green Bay Packers",
    HOU:"Houston Texans",IND:"Indianapolis Colts",JAX:"Jacksonville Jaguars",KC:"Kansas City Chiefs",
    LV:"Las Vegas Raiders",LAC:"Los Angeles Chargers",LAR:"Los Angeles Rams",MIA:"Miami Dolphins",
    MIN:"Minnesota Vikings",NE:"New England Patriots",NO:"New Orleans Saints",NYG:"New York Giants",
    NYJ:"New York Jets",PHI:"Philadelphia Eagles",PIT:"Pittsburgh Steelers",SEA:"Seattle Seahawks",
    SF:"San Francisco 49ers",TB:"Tampa Bay Buccaneers",TEN:"Tennessee Titans",WAS:"Washington Commanders",
    FA:"Free Agents"
  };
  const TEAM_ORDER = Object.keys(TEAM_NAMES).filter(t=>t!=="FA").sort((a,b)=>TEAM_NAMES[a].localeCompare(TEAM_NAMES[b])).concat("FA");
  const POSITIONS = ["ALL","QB","RB","WR","TE","K","DEF"];
  const TIERS = ["","S","A","B","C","D"];
  const STORAGE = "fantasyDraftAssistantState.v3";
  const PLAYER_CACHE = "fantasyDraftAssistantPlayers.v3";
  const LEAGUE_STORAGE = "fantasyDraftAssistantLeague.v1";
  const DEFAULT_LEAGUE = {teams:12,scoring:"PPR",QB:1,RB:2,WR:2,TE:1,FLEX:1,K:1,DEF:1,BENCH:6};
  let league = {...DEFAULT_LEAGUE,...JSON.parse(localStorage.getItem(LEAGUE_STORAGE)||"{}")};

  const STATS_CACHE = "fantasyDraftAssistantStats2025.v1";
  const PREFS = "fantasyDraftAssistantPrefs.v1";

  let players = [];
  let statsById = {};
  let view = "players";
  let position = "ALL";
  let selectedTeam = localStorage.getItem(PREFS+".team") || "DAL";
  let availableOnly = false;
  let scoring = localStorage.getItem(PREFS+".scoring") || league.scoring || "PPR";
  let state = JSON.parse(localStorage.getItem(STORAGE) || '{"rankings":{},"drafted":{},"mine":{},"history":[]}');
  state.rankings=state.rankings||{};
  state.drafted=state.drafted||{};
  state.mine=state.mine||{};
  state.history=Array.isArray(state.history)?state.history:[];

  const $ = id => document.getElementById(id);
  const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  const num = v => { const n=Number(v); return Number.isFinite(n)?n:0; };
  const fmt = (v,d=0) => Number.isFinite(Number(v)) ? Number(v).toFixed(d) : "—";
  const normalizeName = s => String(s||"").toLowerCase()
    .normalize("NFD").replace(/[\u0300-\u036f]/g,"")
    .replace(/\b(jr|sr|ii|iii|iv)\b\.?/g,"")
    .replace(/[^a-z0-9]/g,"");

  function saveState(){ localStorage.setItem(STORAGE, JSON.stringify(state)); }

  function normalizePlayer(id,p){
    const fantasy = Array.isArray(p.fantasy_positions) ? p.fantasy_positions : [];
    let pos = p.position || fantasy[0] || "";
    if(pos === "DST") pos = "DEF";
    if(!["QB","RB","WR","TE","K","DEF"].includes(pos)) return null;
    const full = p.full_name || [p.first_name,p.last_name].filter(Boolean).join(" ") || p.search_full_name;
    if(!full) return null;
    return {
      id:String(id), name:full, team:p.team || "FA", position:pos,
      number:p.number ?? null, status:p.status || "", injury:p.injury_status || ""
    };
  }

  function buildSleeperStatsMap(data){
    const out={};
    const absorb=(id,raw)=>{
      if(!raw || typeof raw!=="object") return;
      const st=(raw.stats && typeof raw.stats==="object") ? raw.stats : raw;
      const playerId=String(raw.player_id || st.player_id || id || "");
      if(!playerId) return;
      const std=num(st.pts_std);
      const ppr=num(st.pts_ppr);
      const half=num(st.pts_half_ppr || st.pts_half || (std + 0.5*num(st.rec)));
      out[playerId]={
        games:num(st.gp || st.games),
        std,ppr,half,
        passYds:num(st.pass_yd), passTD:num(st.pass_td), passInt:num(st.pass_int),
        rushAtt:num(st.rush_att), rushYds:num(st.rush_yd), rushTD:num(st.rush_td),
        targets:num(st.rec_tgt || st.targets), rec:num(st.rec), recYds:num(st.rec_yd), recTD:num(st.rec_td)
      };
    };
    if(Array.isArray(data)){
      for(const item of data) absorb(item?.player_id,item);
    }else if(data && typeof data==="object"){
      for(const [id,item] of Object.entries(data)) absorb(id,item);
    }
    return out;
  }

  async function loadPlayers(force=false){
    const cached = !force ? JSON.parse(localStorage.getItem(PLAYER_CACHE) || "null") : null;
    if(cached?.players?.length && Date.now()-cached.savedAt < 24*60*60*1000){
      players=cached.players;
      return true;
    }
    const r=await fetch(PLAYER_API);
    if(!r.ok) throw new Error(`Sleeper HTTP ${r.status}`);
    const data=await r.json();
    players=Object.entries(data).map(([id,p])=>normalizePlayer(id,p)).filter(Boolean);
    localStorage.setItem(PLAYER_CACHE,JSON.stringify({savedAt:Date.now(),players}));
    return true;
  }

  async function loadStats(force=false){
    const cached = !force ? JSON.parse(localStorage.getItem(STATS_CACHE) || "null") : null;
    if(cached?.stats && Object.keys(cached.stats).length){
      statsById=cached.stats;
      return true;
    }
    const r=await fetch(STATS_API);
    if(!r.ok) throw new Error(`nflverse HTTP ${r.status}`);
    const data=await r.json();
    statsById=buildSleeperStatsMap(data);
    if(!Object.keys(statsById).length) throw new Error("Sleeper stats returned no usable records");
    localStorage.setItem(STATS_CACHE,JSON.stringify({savedAt:Date.now(),stats:statsById}));
    return true;
  }

  async function loadAll(force=false){
    $("status").textContent=force?"Refreshing player data and 2025 stats…":"Loading player data and 2025 stats…";
    let playerOK=false, statsOK=false;
    try{ await loadPlayers(force); playerOK=true; }catch(e){
      const c=JSON.parse(localStorage.getItem(PLAYER_CACHE)||"null");
      if(c?.players?.length){players=c.players;playerOK=true;}
    }
    try{ await loadStats(force); statsOK=true; }catch(e){
      const c=JSON.parse(localStorage.getItem(STATS_CACHE)||"null");
      if(c?.stats){statsById=c.stats;statsOK=true;}
    }
    if(playerOK){
      $("status").textContent=`${players.length} active players loaded${statsOK?" • 2025 stats loaded":" • 2025 stats unavailable (player rankings still work)"}.`;
      renderTeamTabs(); render();
    }else{
      $("status").textContent="Could not load players. Connect to the internet and tap Refresh players & stats.";
      $("content").innerHTML='<div class="empty">Player data unavailable.</div>';
    }
  }

  function filteredPlayers(){
    const q=$("search").value.trim().toLowerCase();
    return players.filter(p=>{
      // Normal browsing stays scoped to the selected NFL team.
      // Search and the DEF position filter intentionally span the entire league.
      if(!q && position!=="DEF" && selectedTeam && p.team!==selectedTeam) return false;
      if(position!=="ALL" && p.position!==position) return false;
      if(availableOnly && state.drafted[p.id]) return false;
      if(q && !`${p.name} ${p.team} ${TEAM_NAMES[p.team]||""}`.toLowerCase().includes(q)) return false;
      return true;
    });
  }

  function fantasyPoints(s){
    if(!s) return null;
    if(scoring==="STD") return s.std;
    if(scoring==="HALF") return s.half;
    return s.ppr;
  }

  function statsLine(p){
    const s=statsById[p.id];
    if(!s) return `<div class="stats">2025: no regular-season stats found</div>`;
    const pts=fantasyPoints(s);
    const ppg=s.games>0?pts/s.games:null;
    let detail="";
    if(p.position==="QB"){
      detail=`Pass ${fmt(s.passYds)} YD / ${fmt(s.passTD)} TD • Rush ${fmt(s.rushYds)} YD / ${fmt(s.rushTD)} TD`;
    }else if(p.position==="RB"){
      detail=`${fmt(s.rushAtt)} CAR • ${fmt(s.rushYds)} RUSH YD • ${fmt(s.rec)} REC • ${fmt(s.recYds)} REC YD • ${fmt(s.rushTD+s.recTD)} TD`;
    }else if(p.position==="WR" || p.position==="TE"){
      detail=`${fmt(s.targets)} TGT • ${fmt(s.rec)} REC • ${fmt(s.recYds)} YD • ${fmt(s.recTD)} TD`;
    }else{
      detail=`${fmt(s.games)} games`;
    }
    return `<div class="stats"><span class="stat-primary">${fmt(pts,1)} ${scoring} pts</span>${ppg!==null?` • ${fmt(ppg,1)} PPG`:""}<br>${detail}</div>`;
  }

  function headshotMarkup(p){
    // Sleeper player portraits use the same stable player ID already used by the app.
    // DEF entries usually do not have a player portrait, so use a team-abbreviation fallback.
    const fallback=esc((p.position==="DEF" ? p.team : p.name.split(/\s+/).map(x=>x[0]).slice(0,2).join("")).toUpperCase());
    if(p.position==="DEF"){
      return `<div class="headshot" aria-hidden="true">${fallback}</div>`;
    }
    const url=`https://sleepercdn.com/content/nfl/players/${encodeURIComponent(p.id)}.jpg`;
    return `<div class="headshot" aria-hidden="true"><span class="photo-fallback">${fallback}</span><img class="player-photo" src="${url}" alt="" loading="lazy" decoding="async"></div>`;
  }

  function pprSortValue(p){
    const s=statsById[p.id];
    return s ? Number(s.pts_ppr ?? s.ppr ?? s.fpts_ppr ?? 0) : -1;
  }

  function playerRow(p,showRank=false,allowMove=false){
    const tier=state.rankings[p.id]?.tier||"";
    const rank=state.rankings[p.id]?.rank||"";
    const drafted=!!state.drafted[p.id];
    const mine=!!state.mine[p.id];
    const injury=p.injury?` • ${esc(p.injury)}`:"";

    let moveControls="";
    if(allowMove && tier){
      const tierIds=Object.keys(state.rankings)
        .filter(id=>state.rankings[id]?.tier===tier)
        .sort((a,b)=>(state.rankings[a].rank||9999)-(state.rankings[b].rank||9999));
      const idx=tierIds.indexOf(p.id);
      moveControls=`<div class="rank-move">
        <button class="move-up-btn" title="Move ${esc(p.name)} up in Tier ${tier}" ${idx<=0?"disabled":""}>↑</button>
        <button class="move-down-btn" title="Move ${esc(p.name)} down in Tier ${tier}" ${idx<0||idx>=tierIds.length-1?"disabled":""}>↓</button>
      </div>`;
    }

    return `<div class="player ${drafted?'drafted':''} ${mine?'mine':''}" data-id="${esc(p.id)}">
      <div class="identity">
        ${headshotMarkup(p)}
        <div class="player-copy">
          <div class="name">${showRank?`<span class="rank">${rank||""}</span> `:""}${esc(p.name)}${view==="draft"&&priorityNeedForPosition(p.position)?`<span class="need-badge">NEED ${priorityNeedForPosition(p.position)}</span>`:""}</div>
          <div class="meta">${esc(p.team)} • ${esc(p.position)}${tier?` • ${tier}${rank}`:""}${injury}${drafted?" • Drafted":""}${mine?" • MY TEAM":""}</div>
          ${statsLine(p)}
        </div>
      </div>
      <div class="actions">
        ${moveControls}
        <button class="clear-rank-btn" title="Clear ranking" ${tier?"":"disabled"}>Clr</button>
        <select class="tier-select" aria-label="Tier for ${esc(p.name)}">
          ${TIERS.map(t=>`<option value="${t}" ${t===tier?'selected':''}>${t||"—"}</option>`).join("")}
        </select>
        <button class="draft-btn mine-btn" title="My team">${mine?"★":"☆"}</button>
        <button class="draft-btn drafted-btn" title="Mark taken">${drafted&&!mine?"↩":"✕"}</button>
      </div>
    </div>`;
  }

  function renderPlayers(){
    const arr=filteredPlayers();
    const q=$("search").value.trim().toLowerCase();
    if(!arr.length) return `<div class="empty">${q?"No players found across the NFL.":"No matching players for this filter."}</div>`;

    const renderTeamSection=(team,teamPlayers)=>{
      const sections=["QB","RB","WR","TE","K","DEF"].filter(pos=>teamPlayers.some(p=>p.position===pos)).map(pos=>{
        const list=teamPlayers.filter(p=>p.position===pos).sort((a,b)=>{
          const diff=pprSortValue(b)-pprSortValue(a);
          if(diff!==0) return diff;
          return a.name.localeCompare(b.name);
        });
        return `<div class="position" id="pos-${team}-${pos}"><h3>${pos}</h3>${list.map(p=>playerRow(p)).join("")}</div>`;
      }).join("");
      return `<section class="team"><h2><span class="team-title">${teamLogoMarkup(team)}<span>${esc(team)}</span></span></h2>${sections}</section>`;
    };

    // DEF is a league-wide condensed view: one row per NFL defense.
    if(!q && position==="DEF"){
      const list=[...arr].sort((a,b)=>{
        const diff=pprSortValue(b)-pprSortValue(a);
        if(diff!==0) return diff;
        return (TEAM_NAMES[a.team]||a.team).localeCompare(TEAM_NAMES[b.team]||b.team);
      });
      return `<section class="team">
        <h2>All Defenses <span class="small">(${list.length})</span></h2>
        <div class="position"><h3>DEF</h3>${list.map(p=>playerRow(p)).join("")}</div>
      </section>`;
    }

    // Search results intentionally span all NFL teams and are grouped by team.
    if(q){
      const teams=[...new Set(arr.map(p=>p.team||"FA"))].sort((a,b)=>(TEAM_NAMES[a]||a).localeCompare(TEAM_NAMES[b]||b));
      return teams.map(team=>renderTeamSection(team,arr.filter(p=>(p.team||"FA")===team))).join("");
    }

    return renderTeamSection(selectedTeam,arr);
  }

  function renderBoard(){
    return ["S","A","B","C","D"].map(tier=>{
      let arr=players.filter(p=>state.rankings[p.id]?.tier===tier);
      if(position!=="ALL") arr=arr.filter(p=>p.position===position);
      if(availableOnly) arr=arr.filter(p=>!state.drafted[p.id]);
      const q=$("search").value.trim().toLowerCase();
      if(q) arr=arr.filter(p=>`${p.name} ${p.team}`.toLowerCase().includes(q));
      arr.sort((a,b)=>(state.rankings[a.id]?.rank||9999)-(state.rankings[b.id]?.rank||9999));
      return `<section class="tier-section">
        <div class="tier-head"><strong>Tier ${tier}</strong><span class="small">${arr.length} players</span></div>
        ${arr.length?arr.map(p=>playerRow(p,true,true)).join(""):'<div class="empty">No players assigned</div>'}
      </section>`;
    }).join("");
  }

  function myTeamPlayers(){
    return players.filter(p=>state.mine[p.id]);
  }

  function rosterNeeds(){
    const counts={QB:0,RB:0,WR:0,TE:0,K:0,DEF:0};
    myTeamPlayers().forEach(p=>{ if(counts[p.position]!==undefined) counts[p.position]++; });

    const req={QB:+league.QB||0,RB:+league.RB||0,WR:+league.WR||0,TE:+league.TE||0,K:+league.K||0,DEF:+league.DEF||0};
    const fixedNeeds={};
    Object.keys(req).forEach(pos=>fixedNeeds[pos]=Math.max(0,req[pos]-counts[pos]));

    // FLEX is filled only by RB/WR/TE players beyond their fixed starter requirements.
    const flexEligibleExcess=["RB","WR","TE"].reduce((sum,pos)=>sum+Math.max(0,counts[pos]-req[pos]),0);
    const flexFilled=Math.min(+league.FLEX||0,flexEligibleExcess);
    const flexNeed=Math.max(0,(+league.FLEX||0)-flexFilled);

    const fixedFilled=Object.keys(req).reduce((sum,pos)=>sum+Math.min(counts[pos],req[pos]),0);
    const starterFilled=fixedFilled+flexFilled;
    const totalPlayers=myTeamPlayers().length;
    const benchFilled=Math.max(0,totalPlayers-starterFilled);
    const benchNeed=Math.max(0,(+league.BENCH||0)-benchFilled);

    return {counts,req,fixedNeeds,flexNeed,flexFilled,benchNeed,benchFilled,totalPlayers};
  }

  function priorityNeedForPosition(pos){
    const n=rosterNeeds();
    if(n.fixedNeeds[pos]>0) return pos;
    if(["RB","WR","TE"].includes(pos) && n.flexNeed>0) return "FLEX";
    return "";
  }

  function rosterNeedsMarkup(compact=false){
    const n=rosterNeeds();
    const chips=[];
    ["QB","RB","WR","TE","K","DEF"].forEach(pos=>{
      const need=n.fixedNeeds[pos];
      chips.push(`<span class="need-chip ${need?"open":"done"}">${pos} ${n.counts[pos]}/${n.req[pos]}${need?` • need ${need}`:" ✓"}</span>`);
    });
    if((+league.FLEX||0)>0) chips.push(`<span class="need-chip ${n.flexNeed?"open":"done"}">FLEX ${n.flexFilled}/${+league.FLEX||0}${n.flexNeed?` • need ${n.flexNeed}`:" ✓"}</span>`);
    if((+league.BENCH||0)>0) chips.push(`<span class="need-chip ${n.benchNeed?"open":"done"}">Bench ${n.benchFilled}/${+league.BENCH||0}${n.benchNeed?` • open ${n.benchNeed}`:" ✓"}</span>`);
    return `<div class="needs-box"><div class="needs-title">Roster Needs • ${league.teams}-team ${league.scoring==="HALF"?"Half PPR":league.scoring==="STD"?"Standard":"PPR"}</div><div class="needs-chips">${chips.join("")}</div></div>`;
  }

  function openLeagueSettings(){
    $("leagueTeams").value=league.teams;
    $("leagueScoring").value=league.scoring;
    ["QB","RB","WR","TE","FLEX","K","DEF"].forEach(pos=>$("league"+pos).value=league[pos]);
    $("leagueBench").value=league.BENCH;
    $("leagueModal").classList.add("open");
    $("leagueModal").setAttribute("aria-hidden","false");
  }

  function closeLeagueSettings(){
    $("leagueModal").classList.remove("open");
    $("leagueModal").setAttribute("aria-hidden","true");
  }

  function saveLeagueSettings(){
    const clamp=(id,min,max)=>Math.max(min,Math.min(max,parseInt($(id).value||"0",10)));
    league={
      teams:clamp("leagueTeams",4,32),
      scoring:$("leagueScoring").value,
      QB:clamp("leagueQB",0,4),
      RB:clamp("leagueRB",0,8),
      WR:clamp("leagueWR",0,8),
      TE:clamp("leagueTE",0,4),
      FLEX:clamp("leagueFLEX",0,4),
      K:clamp("leagueK",0,2),
      DEF:clamp("leagueDEF",0,2),
      BENCH:clamp("leagueBench",0,20)
    };
    localStorage.setItem(LEAGUE_STORAGE,JSON.stringify(league));
    scoring=league.scoring;
    localStorage.setItem(PREFS+".scoring",scoring);
    $("scoringSelect").value=scoring;
    closeLeagueSettings();
    render();
  }

  function renderDraftMode(){
    const q=$("search").value.trim().toLowerCase();
    let ranked=players.filter(p=>state.rankings[p.id]?.tier && !state.drafted[p.id]);
    if(position!=="ALL") ranked=ranked.filter(p=>p.position===position);
    if(q) ranked=ranked.filter(p=>`${p.name} ${p.team} ${TEAM_NAMES[p.team]||""}`.toLowerCase().includes(q));

    const myCount=Object.keys(state.mine).filter(id=>state.mine[id]).length;
    const draftedCount=Object.keys(state.drafted).filter(id=>state.drafted[id]).length;
    const availableRanked=ranked.length;
    const historyCount=state.history.length;

    const sections=["S","A","B","C","D"].map(tier=>{
      const arr=ranked.filter(p=>state.rankings[p.id]?.tier===tier)
        .sort((a,b)=>(state.rankings[a.id]?.rank||9999)-(state.rankings[b.id]?.rank||9999));
      if(!arr.length) return "";
      return `<section class="tier-section">
        <div class="tier-head"><strong>Tier ${tier}</strong><span class="small">${arr.length} available</span></div>
        ${arr.map(p=>playerRow(p,true,true)).join("")}
      </section>`;
    }).join("");

    return `<div class="draft-mode-head">
      <h2>Best Available</h2>
      <button id="undoDraftBtn" class="undo-btn" ${historyCount?"":"disabled"}>↶ Undo Last Pick</button>
    </div>
    <div class="draft-summary">
      <div class="draft-chip">Available ranked: <strong>${availableRanked}</strong></div>
      <div class="draft-chip">Drafted: <strong>${draftedCount}</strong></div>
      <div class="draft-chip">My Team: <strong>${myCount}</strong></div>
    </div>
    ${rosterNeedsMarkup(true)}
    ${sections || `<div class="empty">${q?"No available ranked players match your search/filter.":"No available ranked players. Add players to S/A/B/C/D in My Rankings."}</div>`}`;
  }

  function renderMyTeam(){
    let arr=players.filter(p=>state.mine[p.id]);
    const q=$("search").value.trim().toLowerCase();
    if(q) arr=arr.filter(p=>`${p.name} ${p.team} ${TEAM_NAMES[p.team]||""}`.toLowerCase().includes(q));
    if(position!=="ALL") arr=arr.filter(p=>p.position===position);

    if(!arr.length){
      return `${rosterNeedsMarkup()}<div class="empty">No players on My Team${position!=="ALL"?" at this position":""}. Tap ☆ next to a player when you draft them.</div>`;
    }

    const order=["QB","RB","WR","TE","K","DEF"];
    return rosterNeedsMarkup()+order.filter(pos=>arr.some(p=>p.position===pos)).map(pos=>{
      const list=arr.filter(p=>p.position===pos).sort((a,b)=>{
        const diff=pprSortValue(b)-pprSortValue(a);
        if(diff!==0) return diff;
        return a.name.localeCompare(b.name);
      });
      return `<section class="tier-section">
        <div class="tier-head"><strong>${pos}</strong><span class="small">${list.length} player${list.length===1?"":"s"}</span></div>
        ${list.map(p=>playerRow(p,false)).join("")}
      </section>`;
    }).join("");
  }

  function rerank(tier){
    const ids=Object.keys(state.rankings).filter(id=>state.rankings[id]?.tier===tier)
      .sort((a,b)=>(state.rankings[a].rank||9999)-(state.rankings[b].rank||9999));
    ids.forEach((id,i)=>state.rankings[id].rank=i+1);
  }

  function moveRank(id,direction){
    const tier=state.rankings[id]?.tier;
    if(!tier) return;
    const ids=Object.keys(state.rankings)
      .filter(pid=>state.rankings[pid]?.tier===tier)
      .sort((a,b)=>(state.rankings[a].rank||9999)-(state.rankings[b].rank||9999));
    const idx=ids.indexOf(id);
    const swapIdx=idx+direction;
    if(idx<0 || swapIdx<0 || swapIdx>=ids.length) return;
    const other=ids[swapIdx];
    const tmp=state.rankings[id].rank;
    state.rankings[id].rank=state.rankings[other].rank;
    state.rankings[other].rank=tmp;
    saveState(); render();
  }

  function rememberDraftAction(id){
    state.history.push({
      id:String(id),
      drafted:!!state.drafted[id],
      mine:!!state.mine[id],
      at:Date.now()
    });
    if(state.history.length>50) state.history=state.history.slice(-50);
  }

  function undoLastDraftAction(){
    const last=state.history.pop();
    if(!last) return;
    if(last.drafted) state.drafted[last.id]=true; else delete state.drafted[last.id];
    if(last.mine) state.mine[last.id]=true; else delete state.mine[last.id];
    saveState(); render();
  }

  function setTier(id,tier){
    const old=state.rankings[id]?.tier;
    if(old===tier) return;
    if(!tier){delete state.rankings[id]; if(old) rerank(old);}
    else{
      const max=Math.max(0,...Object.values(state.rankings).filter(x=>x.tier===tier).map(x=>x.rank||0));
      state.rankings[id]={tier,rank:max+1};
      if(old&&old!==tier) rerank(old);
    }
    saveState(); render();
  }

  function bindRows(){
    document.querySelectorAll(".player-photo").forEach(img=>{
      const fail=()=>{
        img.style.display="none";
        const fallback=img.parentElement?.querySelector(".photo-fallback");
        if(fallback) fallback.style.display="block";
      };
      img.addEventListener("error",fail,{once:true});
      img.addEventListener("load",()=>{
        const fallback=img.parentElement?.querySelector(".photo-fallback");
        if(fallback) fallback.style.display="none";
      },{once:true});
      if(img.complete && img.naturalWidth===0) fail();
      else if(img.complete && img.naturalWidth>0){
        const fallback=img.parentElement?.querySelector(".photo-fallback");
        if(fallback) fallback.style.display="none";
      }
    });
    document.querySelectorAll(".player").forEach(row=>{
      const id=row.dataset.id;
      row.querySelector(".clear-rank-btn").addEventListener("click",()=>setTier(id,""));
      row.querySelector(".tier-select").addEventListener("change",e=>setTier(id,e.target.value));
      const up=row.querySelector(".move-up-btn");
      const down=row.querySelector(".move-down-btn");
      if(up) up.addEventListener("click",()=>moveRank(id,-1));
      if(down) down.addEventListener("click",()=>moveRank(id,1));

      row.querySelector(".drafted-btn").addEventListener("click",()=>{
        rememberDraftAction(id);
        state.drafted[id]=!state.drafted[id];
        if(!state.drafted[id]) delete state.drafted[id];
        saveState(); render();
      });
      row.querySelector(".mine-btn").addEventListener("click",()=>{
        rememberDraftAction(id);
        state.mine[id]=!state.mine[id];
        if(state.mine[id]){
          state.drafted[id]=true;
        }else{
          delete state.mine[id];
          delete state.drafted[id];
        }
        saveState(); render();
      });
    });
  }

  function teamLogoUrl(team){
    if(!team || team==="FA") return "";
    return `https://a.espncdn.com/i/teamlogos/nfl/500/${team.toLowerCase()}.png`;
  }

  function teamLogoMarkup(team,sizeClass=""){
    if(team==="FA"){
      return `<span class="team-fallback" aria-hidden="true">FA</span>`;
    }
    const src=teamLogoUrl(team);
    return `<img class="${sizeClass}" src="${src}" alt="" loading="lazy" decoding="async" onerror="this.style.display='none';this.nextElementSibling.style.display='flex'"><span class="team-fallback" aria-hidden="true" style="display:none">${esc(team)}</span>`;
  }

  function renderTeamTabs(){
    const host=$("teamTabs");
    host.innerHTML="";
    TEAM_ORDER.forEach(team=>{
      const b=document.createElement("button");
      b.type="button";
      b.className="team-tab"+(team===selectedTeam?" active":"");
      b.innerHTML=teamLogoMarkup(team);
      b.title=TEAM_NAMES[team];
      b.setAttribute("aria-label",TEAM_NAMES[team]);
      b.addEventListener("click",()=>{
        selectedTeam=team;
        localStorage.setItem(PREFS+".team",selectedTeam);
        renderTeamTabs();
        render();
        b.scrollIntoView({behavior:"smooth",block:"nearest",inline:"center"});
      });
      host.appendChild(b);
    });
  }

  function render(){
    $("teamNavHost").style.display=view==="players"?"block":"none";
    if(view==="players") $("content").innerHTML=renderPlayers();
    else if(view==="board") $("content").innerHTML=renderBoard();
    else if(view==="myteam") $("content").innerHTML=renderMyTeam();
    else $("content").innerHTML=renderDraftMode();

    $("playersTab").classList.toggle("active",view==="players");
    $("boardTab").classList.toggle("active",view==="board");
    $("myTeamTab").classList.toggle("active",view==="myteam");
    $("draftTab").classList.toggle("active",view==="draft");

    bindRows();
    const undo=$("undoDraftBtn");
    if(undo) undo.addEventListener("click",undoLastDraftAction);
  }

  POSITIONS.forEach(pos=>{
    const b=document.createElement("button");
    b.textContent=pos; b.className=pos==="ALL"?"active":"";
    b.addEventListener("click",()=>{
      position=pos;
      document.querySelectorAll("#positionFilters button").forEach(x=>x.classList.toggle("active",x.textContent===pos));
      render();
      if(view==="players"&&pos!=="ALL"&&pos!=="DEF"){
        setTimeout(()=>document.getElementById(`pos-${selectedTeam}-${pos}`)?.scrollIntoView({behavior:"smooth",block:"start"}),50);
      }
    });
    $("positionFilters").appendChild(b);
  });

  $("scoringSelect").value=scoring;
  $("scoringSelect").addEventListener("change",e=>{
    scoring=e.target.value;
    league.scoring=scoring;
    localStorage.setItem(PREFS+".scoring",scoring);
    localStorage.setItem(LEAGUE_STORAGE,JSON.stringify(league));
    render();
  });
  $("playersTab").addEventListener("click",()=>{view="players";render()});
  $("boardTab").addEventListener("click",()=>{view="board";render()});
  $("myTeamTab").addEventListener("click",()=>{view="myteam";render()});
  $("draftTab").addEventListener("click",()=>{view="draft";render()});
  $("leagueBtn").addEventListener("click",openLeagueSettings);
  $("leagueCancel").addEventListener("click",closeLeagueSettings);
  $("leagueSave").addEventListener("click",saveLeagueSettings);
  $("leagueModal").addEventListener("click",e=>{if(e.target===$("leagueModal")) closeLeagueSettings();});
  $("search").addEventListener("input",render);
  $("availableToggle").addEventListener("click",()=>{
    availableOnly=!availableOnly;
    $("availableToggle").textContent=`Available only: ${availableOnly?"On":"Off"}`;
    render();
  });
  $("refreshBtn").addEventListener("click",()=>loadAll(true));

  renderTeamTabs();
  if("serviceWorker" in navigator) navigator.serviceWorker.register("./sw.js").catch(()=>{});
  loadAll();
})();
</script>
</body>
</html>
